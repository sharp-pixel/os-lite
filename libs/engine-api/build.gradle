apply plugin: 'opensearch.build'

base { archivesName = 'engine-api' }

testingConventions.enabled = false

// Server-specific signature files reference classes deliberately absent from this library.
tasks.named('forbiddenApisMain').configure { replaceSignatureFiles 'jdk-signatures' }

// The production API deliberately has no external dependencies.
tasks.register('checkApiDependencies') {
    doLast {
        if (!configurations.compileClasspath.files.isEmpty() || !configurations.runtimeClasspath.files.isEmpty()) {
            throw new GradleException('engine-api must remain JDK-only')
        }
    }
}
tasks.named('check').configure { dependsOn 'checkApiDependencies' }
