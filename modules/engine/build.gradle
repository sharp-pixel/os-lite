opensearchplugin {
    description = 'engine provider infrastructure'
    classname = 'org.opensearch.engine.EnginePlugin'
}

repositories {
    mavenLocal()
    maven { url = "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    mavenCentral()
}

testingConventions.enabled = false

dependencies {
    api project(':libs:engine-api')
    testImplementation libs.bundles.unit.test
}
