opensearchplugin {
    description = 'A demo plugin to confirm that we can add actions'
    classname = 'org.opensearch.helloworld.HelloWorldPlugin'
    extendedPlugins = ['rest']
}

repositories {
    mavenLocal()
    maven { url = "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    mavenCentral()
}

testingConventions.enabled = false

dependencies {
    testImplementation libs.junit
    testImplementation libs.hamcrest
    testImplementation libs.randomizedrunner
    testImplementation libs.lucene.test.framework
    testRuntimeOnly libs.httpcore5
    compileOnly project(':modules:rest:spi')
}
