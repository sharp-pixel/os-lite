opensearchplugin {
    description = 'Indexing REST API extension hub'
    classname = 'org.opensearch.api.indexing.IndexingApiPlugin'
    extendedPlugins = ['rest']
}

repositories {
    mavenLocal()
    maven { url = "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    mavenCentral()
}

testingConventions.enabled = false

dependencies {
    compileOnly project(':modules:rest:spi')
}
