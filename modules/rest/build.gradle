opensearchplugin {
    description = 'REST layer plugin providing HTTP request dispatching'
    classname = 'org.opensearch.rest.RestPlugin'
}

repositories {
    mavenLocal()
    maven { url = "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    mavenCentral()
}

testingConventions.enabled = false

dependencies {
    testImplementation libs.bundles.unit.test
    api project('spi')
}
