plugins {
    id('opensearch.build')
    id('opensearch.optional-dependencies')
}
group = 'org.opensearch'

repositories {
    mavenLocal()
    maven { url = "https://ci.opensearch.org/ci/dbc/snapshots/maven/" }
    mavenCentral()
}

dependencies {
    testImplementation libs.bundles.unit.test
    api "org.opensearch:opensearch-agent-bootstrap:${project.version}"
    api "org.opensearch:opensearch-agent-policy:${project.version}"
    api "org.opensearch:opensearch-cli:${project.version}"
    api project(':libs:core')
    api "org.opensearch:opensearch-plugin-classloader:${project.version}"
    // compileOnly "org.opensearch:opensearch-plugin-classloader:${project.version}"
    // testRuntimeOnly "org.opensearch:opensearch-plugin-classloader:${project.version}"
    api "org.opensearch:opensearch-telemetry:${project.version}"
    api "org.opensearch:opensearch-x-content:${project.version}"
    api libs.jna
    api libs.reactor.core
    api libs.reactivestreams
    api libs.log4japi
    api libs.log4jcore, optional
    api libs.log4jjul
    compileOnlyApi "org.jspecify:jspecify:1.0.0"
    compileOnlyApi "com.google.errorprone:error_prone_annotations:${versions.error_prone_annotations}"
    annotationProcessor libs.log4jcore
    annotationProcessor "org.opensearch:opensearch-common:${project.version}"
}

compileJava {
    options.compilerArgs += ['-processor', ['org.apache.logging.log4j.core.config.plugins.processor.PluginProcessor',
                                            'org.opensearch.common.annotation.processor.ApiAnnotationProcessor'].join(',')]
}

tasks.named("dependencyLicenses").configure { it.enabled = false }
testingConventions.enabled = false

// Inspect both dependency coordinates and compiled references, including transitive host JARs.
tasks.register('checkLuceneIsolation') {
    dependsOn tasks.named('classes'), configurations.runtimeClasspath
    inputs.files(sourceSets.main.output, configurations.runtimeClasspath)
    doLast {
        def forbidden = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group == 'org.apache.lucene' ||
                (it.moduleVersion.id.group == 'org.opensearch' && it.name == 'opensearch-core')
        }
        if (!forbidden.isEmpty()) throw new GradleException("Host runtime contains engine/upstream-core artifacts: ${forbidden}")
        def inspect = { byte[] bytes, String origin ->
            def constants = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            if (constants.contains('org/apache/lucene/') || constants.contains('org.apache.lucene.')) {
                throw new GradleException("Host class references Lucene: ${origin}")
            }
        }
        (sourceSets.main.output.files + configurations.runtimeClasspath.files).each { entry ->
            if (entry.isDirectory()) {
                fileTree(entry).matching { include '**/*.class' }.each { inspect(it.bytes, it.toString()) }
            } else if (entry.name.endsWith('.jar')) {
                new java.util.zip.ZipFile(entry).withCloseable { zip ->
                    zip.entries().each { member ->
                        if (member.name.endsWith('.class')) {
                            zip.getInputStream(member).withCloseable { inspect(it.readAllBytes(), "${entry.name}!${member.name}") }
                        }
                    }
                }
            }
        }
    }
}
tasks.named('check').configure { dependsOn 'checkLuceneIsolation' }

// Deliberately omit testRuntimeClasspath: its Lucene test framework would hide missing host dependencies.
tasks.register('luceneFreeSmoke', JavaExec) {
    dependsOn tasks.named('testClasses'), tasks.named('checkLuceneIsolation'), ':distribution:buildModules'
    classpath = sourceSets.test.output + sourceSets.main.runtimeClasspath
    mainClass = 'org.opensearch.node.LuceneFreeNodeSmoke'
    executable = new File(org.opensearch.gradle.info.BuildParams.runtimeJavaHome, 'bin/java').absolutePath
    jvmArgs '-ea', '-XX:ActiveProcessorCount=2', '--enable-native-access=ALL-UNNAMED', '--add-modules=jdk.incubator.vector'
    args rootProject.file('distribution/build/outputs/dist/modules').absolutePath
}
tasks.named('check').configure { dependsOn 'luceneFreeSmoke' }
